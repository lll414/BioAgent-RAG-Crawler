# "Modern Statistics for Modern Biology" 爬取配置
# 文件名: config.yaml
# 文件名: config.yaml
# 文件名: config.yaml
sites:
  - name: "Modern_Statistics_for_Modern_Biology_by_Template"
    
    # 【新功能开关】设置为 true 来跳过已存在的文件
    skip_existing: true
    
    url_template: "https://www.huber.embl.de/msmb/{i}-chap.html"
    template_start: 3
    template_end: 3
    
    output:
      directory: "/Users/lll/Desktop/实习/黑森智动/RAG_Supplement/output/MSMB_by_Template"
    
    parser:
      main_container_selector: "main#quarto-document-content"
      remove_selectors:
        - ".page-navigation"
        - ".L2T-edit-link"











