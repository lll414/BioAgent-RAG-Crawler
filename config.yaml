# --- 配置说明 ---
# name: "BiocBookDemo"
#   - 为这个爬取任务命名。
# start_url: "https://bioconductor.org/books/release/BiocBookDemo/index.html"
#   - 爬虫从这本书的主页开始工作。
# discovery_selector: "#quarto-sidebar a.sidebar-link"
#   - 爬虫会查找 ID 为 `quarto-sidebar` 的侧边栏，并抓取里面所有 class 为 `sidebar-link` 的 `<a>` 链接，以发现所有章节页面。
# output.directory: "./output/BiocBookDemo"
#   - 将处理后的 HTML 文件保存到这个指定的文件夹。
# parser.main_container_selector: "main#quarto-document-content"
#   - 在每个页面中，只保留 `<main id="quarto-document-content">` 标签内的内容，这是页面的正文。
# parser.remove_selectors:
#   - 在保留的正文内容中，进一步精确地移除一些无用信息，比如标题、按钮和参考文献，让内容更纯净。

sites:
  - name: "BiocPy_Tutorial" # 网站的唯一标识名
    start_url: "https://biocpy.github.io/tutorial/" # 爬虫的起始页面
    
    # 链接发现规则：告诉爬虫如何找到网站内所有需要爬取的页面链接
    discovery_selector: "#quarto-sidebar a.sidebar-link" # 同样是 Quarto 网站的侧边栏导航链接
    
    output:
      directory: "./output/BiocPy_Tutorial" # 指定抓取内容的输出目录
      
    parser:
      # 主内容容器：定义页面的核心内容区域
      main_container_selector: "main#quarto-document-content" # Quarto 网站正文区域的ID
      
      # 移除规则：在主内容容器内，移除不需要的元素
      remove_selectors:
        - "#title-block-header" # 移除每页顶部的标题块
        - ".code-copy-button" # 移除代码块右上角的“复制”按钮
        - ".toc-actions" # 移除目录下的 "Report an issue" 按钮
        - ".anchored" # 移除标题旁边的锚点链接图标
        
# --- 配置说明 ---
# name: "BiocPy_Tutorial"
#   - 为这个爬取任务命名。
# start_url: "https://biocpy.github.io/tutorial/"
#   - 爬虫从这个教程的主页开始。
# discovery_selector: "#quarto-sidebar a.sidebar-link"
#   - 爬虫会查找 ID 为 `quarto-sidebar` 的侧边栏，并抓取里面所有 class 为 `sidebar-link` 的 `<a>` 链接，从而发现所有章节页面。
# output.directory: "./output/BiocPy_Tutorial"
#   - 将处理后的干净 HTML/Markdown 文件保存到这个文件夹。
# parser.main_container_selector: "main#quarto-document-content"
#   - 在每个页面中，只保留 `<main id="quarto-document-content">` 标签内的内容，这是页面的正文部分。
# parser.remove_selectors:
#   - 在保留的正文内容中，进一步精确地移除一些无用元素，比如页面标题、代码复制按钮、报告问题按钮和锚点图标，以确保提取的内容是纯净的正文。












